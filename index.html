<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子名片</title>
<script src="config.js"></script>
<script src="flex.js"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --main:#1F3A34; --accent:#E3B76B; --soft:#F3EFE6; --text:#22302C; --sub:#6B7570; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
         background:var(--soft); color:var(--text); min-height:100vh; padding:24px 16px 40px; }
  .card { max-width:420px; margin:0 auto; background:#fff; border-radius:20px; overflow:hidden;
          box-shadow:0 10px 30px rgba(31,58,52,.12); }
  .top { background:var(--main); color:#fff; padding:26px 22px 54px; }
  .top .co { font-size:24px; font-weight:700; letter-spacing:2px; }
  .top .en { color:var(--accent); font-size:12px; margin-top:4px; letter-spacing:1px; }
  .who { display:flex; gap:14px; align-items:center; padding:0 22px; margin-top:-36px; }
  .avatar { width:76px; height:76px; border-radius:50%; background:var(--soft); border:4px solid #fff;
            display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700;
            color:var(--main); flex:none; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .who .n { font-size:21px; font-weight:700; margin-top:44px; }
  .who .n small { font-size:13px; color:var(--sub); font-weight:400; margin-left:6px; }
  .who .t { font-size:13px; color:var(--sub); margin-top:2px; }
  .slogan { padding:16px 22px 4px; font-size:14px; line-height:1.6; }
  .list { padding:10px 22px; }
  .list a { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #EEEAE1;
            color:var(--text); text-decoration:none; font-size:14px; }
  .list a:last-child { border:none; }
  .list span:first-child { color:var(--sub); width:56px; flex:none; }
  .btns { padding:10px 22px 24px; display:grid; gap:10px; }
  .btn { display:block; text-align:center; padding:14px; border-radius:12px; font-size:15px;
         font-weight:700; text-decoration:none; border:none; cursor:pointer; font-family:inherit; }
  .gold { background:var(--accent); color:var(--main); }
  .green { background:var(--main); color:#fff; }
  .ghost { background:var(--soft); color:var(--main); }
  .services { max-width:420px; margin:16px auto 0; background:#fff; border-radius:20px; padding:20px 22px; }
  .services h3 { font-size:16px; margin-bottom:10px; color:var(--main); }
  .services li { list-style:none; font-size:14px; padding:6px 0; }
  .services li::before { content:"・"; color:var(--accent); font-weight:700; }
  #msg { text-align:center; font-size:13px; color:var(--sub); margin-top:14px; min-height:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><div class="co" id="co"></div><div class="en" id="en"></div></div>
    <div class="who">
      <div class="avatar" id="avatar"></div>
      <div><div class="n" id="name"></div><div class="t" id="title"></div></div>
    </div>
    <p class="slogan" id="slogan"></p>
    <div class="list" id="list"></div>
    <div class="btns">
      <button class="btn gold" id="shareBtn">用 LINE 傳這張名片</button>
      <a class="btn green" id="lineBtn">加 LINE 聊聊需求</a>
      <a class="btn ghost" href="contact.vcf" download>存入手機通訊錄</a>
    </div>
  </div>
  <div class="services"><h3 id="svT"></h3><ul id="svL"></ul></div>
  <p id="msg"></p>

<script>
const C = window.CARD;
const $ = id => document.getElementById(id);
$("co").textContent = C.company;
$("en").textContent = C.companyEn;
$("avatar").innerHTML = C.avatarImg ? `<img src="${C.avatarImg}">` : C.avatarText;
$("name").innerHTML = `${C.name}<small>${C.nameEn}</small>`;
$("title").textContent = C.title;
$("slogan").textContent = C.slogan;
const rows = [["電話", C.phone, "tel:" + C.phone]];
if (C.email) rows.push(["E-mail", C.email, "mailto:" + C.email]);
rows.push(["LINE", C.lineId, "https://line.me/R/ti/p/" + encodeURIComponent(C.lineId)]);
rows.push(["官網", C.website.replace(/^https?:\/\//, ""), C.website]);
if (C.instagram) rows.push(["IG", C.instagram.split("/").filter(Boolean).pop(), C.instagram]);
$("list").innerHTML = rows.map(r => `<a href="${r[2]}"><span>${r[0]}</span><span>${r[1]}</span></a>`).join("");
$("lineBtn").href = "https://line.me/R/ti/p/" + encodeURIComponent(C.lineId);
$("svT").textContent = C.serviceTitle;
$("svL").innerHTML = C.services.map(s => `<li>${s}</li>`).join("");
document.title = C.name + "｜" + C.company + " 電子名片";

const msg = t => $("msg").textContent = t;
let ready = false;

async function share() {
  if (!ready) return msg("LINE 尚未連線，請從 LINE 開啟此頁");
  if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href.split("?")[0] + "?share=1" });
  if (!liff.isApiAvailable("shareTargetPicker")) return msg("這個環境不支援轉傳，請更新 LINE 版本");
  try {
    const res = await liff.shareTargetPicker([buildFlex(C)], { isMultiple: true });
    if (res) {
      msg("已傳送，謝謝！");
      if (liff.isInClient()) setTimeout(() => liff.closeWindow(), 800);
    } else msg("");
  } catch (e) { msg("傳送失敗：" + e.message); }
}
$("shareBtn").onclick = share;

if (!C.liffId || C.liffId.includes("請填")) {
  msg("（尚未設定 LIFF ID，目前只能瀏覽）");
} else {
  liff.init({ liffId: C.liffId }).then(() => {
    ready = true;
    if (new URLSearchParams(location.search).get("share") === "1") share();
  }).catch(e => msg("LIFF 初始化失敗：" + e.message));
}
</script>
</body>
</html>
